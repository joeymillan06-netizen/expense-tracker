<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3A4EFB" />
  <title>Ours — Financial Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="auth" class="auth-screen">
    <div class="auth-mark">O</div>
    <div class="auth-copy"><span>PRIVATE SHARED WORKSPACE</span><h1>Our financial<br>home.</h1><p>Money, plans and work—in one quiet place.</p></div>
    <form id="login-form" class="auth-form">
      <label>Who are you?</label>
      <div class="person-picker"><button type="button" class="person active" data-person="Joey">Joey</button><button type="button" class="person" data-person="Grace">Grace</button></div>
      <label for="pin">Private access code</label>
      <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" value="2026" aria-label="Access code" />
      <div id="cloud-fields" class="hidden">
        <label for="cloud-email">Email</label>
        <input id="cloud-email" type="email" autocomplete="email" placeholder="you@example.com" />
        <label for="cloud-password">Password</label>
        <input id="cloud-password" type="password" autocomplete="current-password" placeholder="Your password" />
      </div>
      <button class="primary wide" type="submit">Enter our space <span>→</span></button>
      <small>Demo code: 2026 · Data stays on this device</small>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside class="side-nav">
      <a class="brand" href="#home"><b>O</b><span>Ours</span></a>
      <div id="desktop-nav"></div>
      <div class="side-user"><span class="avatar">J</span><div><b id="side-name">Joey</b><small>Shared with Grace</small></div></div>
    </aside>
    <main>
      <header class="topbar">
        <button class="wordmark" data-nav="home">Ours<span>.</span></button>
        <div class="top-actions"><button class="icon-button" id="sync-btn" aria-label="Sync now" title="Sync now">↻</button><button class="icon-button" id="search-btn" aria-label="Search">⌕</button><button class="avatar" id="profile-btn">J</button></div>
      </header>
      <div id="view" class="view"></div>
    </main>
    <nav id="bottom-nav" class="bottom-nav"></nav>
    <button id="fab" class="fab" aria-label="Quick add">+</button>
  </div>

  <div id="overlay" class="overlay hidden"></div>
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast hidden"></div>
  <script src="config.js?v=20260929-2"></script>
  <script src="supabase.js?v=20260929-3"></script>
  <script src="app.js?v=20261001-2"></script>
</body>
</html>
